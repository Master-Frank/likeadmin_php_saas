app:
  debug: true
  timezone: Asia/Shanghai
  public_dir: ../../server/public
  install_lock: ../../server/config/install.lock
  listen: ":8080"

database:
  hostname: 127.0.0.1
  hostport: 3306
  database: localhost_likeadmin
  username: likeadmin
  password: root
  charset: utf8mb4
  prefix: la_
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime_sec: 300
  conn_max_idle_time_sec: 60

redis:
  host: 127.0.0.1
  port: 6379
  password: ""
  db: 0
  prefix: "la:"
  dial_timeout_ms: 200
  read_timeout_ms: 200
  write_timeout_ms: 200

project:
  unique_identification: likeadmin
  default_password: "123456"
  demo_env: false
  http_host: ""
  version: "1.0.5"
  project_name: Likeadmin-SaaS版
  admin_token:
    expire_duration: 28800
    be_expire_duration: 3600
  tenant_token:
    expire_duration: 28800
    be_expire_duration: 3600
  user_token:
    expire_duration: 28800
    be_expire_duration: 3600
  lists:
    page_size_max: 25000
    page_size: 25
    export_max_rows: 10000
    export_max_pages: 20
  website:
    name: likeadmin
    url: www.likeadmin.cn/
    shop_name: likeadmin
    shop_logo: resource/image/common/shop_logo.png
    pc_logo: resource/image/tenantapi/default/pc_logo.png
    pc_ico: resource/image/tenantapi/default/web_favicon.ico
    h5_favicon: resource/image/tenantapi/default/web_favicon.ico
  login:
    login_way: ["1", "2"]
    coerce_mobile: 1
    third_auth: 1
    wechat_auth: 1
    qq_auth: 0
    login_agreement: 1
  decorate:
    tabbar_style:
      default_color: "#999999"
      selected_color: "#c455ff"
  default_image:
    admin_avatar: resource/image/common/avatar.png
    user_avatar: resource/image/common/default_avatar.png
    qq_group: resource/image/common/qq_group.png
    customer_service: resource/image/common/customer_service.jpg
    menu_admin: resource/image/common/menu_admin.png
    menu_role: resource/image/common/menu_role.png
    menu_dept: resource/image/common/menu_dept.png
    menu_dict: resource/image/common/menu_dict.png
    menu_generator: resource/image/common/menu_generator.png
    menu_auth: resource/image/common/menu_auth.png
    menu_web: resource/image/common/menu_web.png
    menu_file: resource/image/common/menu_file.png
  file_image: [jpg, png, gif, jpeg, webp, ico]
  file_video: [wmv, avi, mpg, mpeg, 3gp, mov, mp4, flv, f4v, rmvb, mkv]
  file_file: [zip, rar, txt, pdf, doc, docx, xls, xlsx, ppt, pptx, csv, ftr, 7z, gz]
  platform:
    name: SaaS平台端
    admin_avatar: resource/image/common/avatar.png
    login_image: resource/image/platformapi/default/login_image.png
    web_logo_light: resource/image/platformapi/default/web_logo_light.png
    web_logo_dark: resource/image/platformapi/default/web_logo_dark.png
    web_favicon: resource/image/platformapi/default/web_favicon.ico
  tenant:
    name: SaaS租户端
    admin_avatar: resource/image/common/shop_logo.png
    login_image: resource/image/tenantapi/default/login_image.png
    web_logo: resource/image/tenantapi/default/web_logo.jpg
    web_favicon: resource/image/tenantapi/default/web_favicon.ico
