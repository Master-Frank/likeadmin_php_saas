# Production cutover: all API + SPA + install + crontab go to Go.
# Static uploads/resource stay on disk (same public_dir the Go process uses).
# After pair.sh is green on this file, php-fpm can be stopped.
#
#   nginx -c /path/to/nginx.production.conf
#
# Override the upstream with LIKEADMIN_GO=127.0.0.1:8080 (default).

upstream likeadmin_go {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name _;
    root /workspace/server/public;
    index index.html;
    client_max_body_size 50m;

    location /platformapi/ {
        proxy_pass http://likeadmin_go;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header token $http_token;
    }
    location /tenantapi/ {
        proxy_pass http://likeadmin_go;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header token $http_token;
    }
    location /api/ {
        proxy_pass http://likeadmin_go;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header token $http_token;
    }
    location /crontab {
        proxy_pass http://likeadmin_go;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /install {
        proxy_pass http://likeadmin_go;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /platform {
        try_files $uri $uri/ /platform/index.html;
    }
    location /admin {
        try_files $uri $uri/ /admin/index.html;
    }
    location /mobile {
        try_files $uri $uri/ /mobile/index.html;
    }
    location /pc {
        try_files $uri $uri/ /pc/index.html;
    }

    location /uploads/ {
        try_files $uri =404;
    }
    location /resource/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
