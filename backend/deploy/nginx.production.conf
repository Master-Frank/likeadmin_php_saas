# Production cutover: all API + SPA + install + crontab go to Go.
# Static uploads/resource stay on disk (same public_dir the Go process uses).
# After pair.sh is green on the strangler file, php-fpm can be stopped.
#
# This file is a complete `nginx -c` config (worker/events/http), same shape
# as nginx.local.conf. Override listen/root/server_name for the host.
#
#   nginx -c /path/to/nginx.production.conf

worker_processes 1;
error_log /tmp/likeadmin-nginx-prod.err;
pid /tmp/likeadmin-nginx-prod.pid;
events { worker_connections 1024; }
http {
    access_log /tmp/likeadmin-nginx-prod.access;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/likeadmin-nginx-prod-body;
    proxy_temp_path /tmp/likeadmin-nginx-prod-proxy;
    fastcgi_temp_path /tmp/likeadmin-nginx-prod-fastcgi;
    uwsgi_temp_path /tmp/likeadmin-nginx-prod-uwsgi;
    scgi_temp_path /tmp/likeadmin-nginx-prod-scgi;
    client_max_body_size 50m;

    upstream likeadmin_go {
        server 127.0.0.1:8080;
    }

    server {
        listen 80;
        server_name _;
        root /workspace/server/public;
        index index.html;

        # ThinkPHP PATHINFO: /index.php/platformapi/... → Go /platformapi/...
        location ~ ^/index.php/(platformapi|tenantapi|api|crontab|install) {
            rewrite ^/index.php(.*)$ $1 break;
            proxy_pass http://likeadmin_go;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header token $http_token;
        }

        location /platformapi/ {
            proxy_pass http://likeadmin_go;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header token $http_token;
        }
        location /tenantapi/ {
            proxy_pass http://likeadmin_go;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header token $http_token;
        }
        location /api/ {
            proxy_pass http://likeadmin_go;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header token $http_token;
        }
        location /crontab {
            proxy_pass http://likeadmin_go;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /install {
            proxy_pass http://likeadmin_go;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /platform {
            try_files $uri $uri/ /platform/index.html;
        }
        location /admin {
            try_files $uri $uri/ /admin/index.html;
        }
        location /mobile {
            try_files $uri $uri/ /mobile/index.html;
        }
        location /pc {
            try_files $uri $uri/ /pc/index.html;
        }

        location /uploads/ {
            try_files $uri =404;
        }
        location /resource/ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
