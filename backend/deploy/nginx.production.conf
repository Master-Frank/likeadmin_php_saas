# Production cutover: all API + SPA + install + crontab go to Go.
# Static uploads/resource stay on disk (same public_dir the Go process uses).
# After pair.sh is green on the strangler file, php-fpm can be stopped.
#
# This file is a complete `nginx -c` config (worker/events/http), same shape
# as nginx.local.conf. Override listen/root/server_name for the host.
#
#   nginx -c /path/to/nginx.production.conf

user www-data;
worker_processes auto;
error_log /var/log/nginx/likeadmin-error.log;
pid /run/likeadmin-nginx.pid;
events { worker_connections 1024; }
http {
    access_log /var/log/nginx/likeadmin-access.log;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 50m;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    upstream likeadmin_go {
        server 127.0.0.1:8080;
        # Multi-instance: add more Go listeners that share Redis and public_dir/OSS.
        # server 127.0.0.1:8081;
    }

    server {
        listen 80;
        server_name _;
        root /opt/likeadmin/server/public;
        index index.html;

        # ThinkPHP PATHINFO: /index.php/platformapi/... → Go /platformapi/...
        location ~ ^/index.php/(platformapi|tenantapi|api|crontab|install) {
            rewrite ^/index.php(.*)$ $1 break;
            proxy_pass http://likeadmin_go;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header token $http_token;
        }

        location /platformapi/ {
            proxy_pass http://likeadmin_go;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header token $http_token;
            add_header Cache-Control "no-store";
            proxy_read_timeout 120s;
        }
        location /tenantapi/ {
            proxy_pass http://likeadmin_go;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header token $http_token;
            add_header Cache-Control "no-store";
        }
        location /api/index/config {
            proxy_pass http://likeadmin_go;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header token $http_token;
        }
        location /api/index/decorate {
            proxy_pass http://likeadmin_go;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header token $http_token;
        }
        location /api/ {
            proxy_pass http://likeadmin_go;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header token $http_token;
            add_header Cache-Control "no-store";
        }
        location /crontab {
            proxy_pass http://likeadmin_go;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /install {
            proxy_pass http://likeadmin_go;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /platform {
            try_files $uri $uri/ /platform/index.html;
        }
        location /admin {
            try_files $uri $uri/ /admin/index.html;
        }
        location /mobile {
            try_files $uri $uri/ /mobile/index.html;
        }
        location /pc {
            try_files $uri $uri/ /pc/index.html;
        }
        # PC decorate links use /pages/...; Go maps them onto /pc/*.
        location /pages {
            proxy_pass http://likeadmin_go;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /packages {
            proxy_pass http://likeadmin_go;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /uploads/ {
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            access_log off;
        }
        # OSS/CDN: send browsers to the object store instead of local disk.
        # location /uploads/ {
        #     return 302 https://cdn.example.com$request_uri;
        # }
        location /resource/ {
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            access_log off;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
