# Production strangler: APIs to Go, SPA/static from PHP public/.
# No php-fpm on the request path. Copy into the site nginx and set
# server_name / ssl / root for the host.
#
#   upstream likeadmin_go { server 127.0.0.1:8080; }
#   include /path/to/nginx.prod.conf;

map $request_uri $go_backend {
    default 0;
    ~^/platformapi/ 1;
    ~^/tenantapi/   1;
    ~^/api/         1;
    ~^/crontab      1;
    ~^/install      1;
}

server {
    listen 80;
    server_name _;
    root /opt/likeadmin/server/public;
    index index.html;
    client_max_body_size 50m;

    location ~ ^/index.php/(platformapi|tenantapi|api|crontab|install) {
        rewrite ^/index.php(.*)$ $1 break;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header token $http_token;
    }

    location /platformapi/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header token $http_token;
    }
    location /tenantapi/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header token $http_token;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header token $http_token;
    }
    location /crontab {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /install {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /platform {
        try_files $uri $uri/ /platform/index.html;
    }
    location /admin {
        try_files $uri $uri/ /admin/index.html;
    }
    location /mobile {
        try_files $uri $uri/ /mobile/index.html;
    }
    location /pc {
        try_files $uri $uri/ /pc/index.html;
    }
    location /pages {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /packages {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        try_files $uri =404;
    }
    location /resource/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
