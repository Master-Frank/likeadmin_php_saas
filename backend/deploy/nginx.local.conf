worker_processes 1;
error_log /tmp/likeadmin-nginx.err;
pid /tmp/likeadmin-nginx.pid;
events { worker_connections 128; }
http {
    access_log /tmp/likeadmin-nginx.access;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    include /workspace/backend/deploy/nginx-strangler.conf;
}
