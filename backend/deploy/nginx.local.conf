worker_processes 1;
error_log /tmp/likeadmin-nginx.err;
pid /tmp/likeadmin-nginx.pid;
events { worker_connections 128; }
http {
    access_log /tmp/likeadmin-nginx.access;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/likeadmin-nginx-body;
    proxy_temp_path /tmp/likeadmin-nginx-proxy;
    fastcgi_temp_path /tmp/likeadmin-nginx-fastcgi;
    uwsgi_temp_path /tmp/likeadmin-nginx-uwsgi;
    scgi_temp_path /tmp/likeadmin-nginx-scgi;
    include /workspace/backend/deploy/nginx-strangler.conf;
}
