# Local / production strangler: API prefixes go to Go; static + leftover PHP stay.
# Go listens on 127.0.0.1:8080. Example:
#   nginx -c /workspace/backend/deploy/nginx-strangler.conf
# Or include this file from the main nginx.conf.

map $request_uri $go_backend {
    default 0;
    ~^/platformapi/ 1;
    ~^/tenantapi/   1;
    ~^/api/         1;
    ~^/crontab      1;
    ~^/install      1;
}

upstream likeadmin_go {
    server 127.0.0.1:8080;
}

server {
    listen 127.0.0.1:8090;
    server_name pair1.likeadmin.test localhost 127.0.0.1;
    root /workspace/server/public;
    index index.html index.php;
    client_max_body_size 50m;

    location /platformapi/ {
        proxy_pass http://likeadmin_go;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header token $http_token;
    }
    location /tenantapi/ {
        proxy_pass http://likeadmin_go;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header token $http_token;
    }
    location /api/ {
        proxy_pass http://likeadmin_go;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header token $http_token;
    }
    location /crontab {
        proxy_pass http://likeadmin_go;
        proxy_set_header Host $host;
    }
    location /install {
        proxy_pass http://likeadmin_go;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
