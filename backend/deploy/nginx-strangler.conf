# Strangler-fig gateway: default PHP, migrated prefixes to Go.
# Upstream Go listens on 127.0.0.1:8080.

map $request_uri $go_backend {
    default 0;
    ~^/platformapi/ 1;
    ~^/tenantapi/   1;
    ~^/api/         1;
}

upstream likeadmin_go {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name _;
    root /path/to/server/public;
    index index.php index.html;

    location / {
        if ($go_backend = 1) {
            proxy_pass http://likeadmin_go;
            break;
        }
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
