# Local / production strangler: API prefixes go to Go; SPA/static from public/.
# Go listens on 127.0.0.1:8080. The Go cmd/strangler occupies :8090, so nginx
# listens on :8091 for a real nginx cutover check. Example:
#   nginx -c /workspace/backend/deploy/nginx.local.conf
# Or include this file from the main nginx.conf.

map $request_uri $go_backend {
    default 0;
    ~^/platformapi/ 1;
    ~^/tenantapi/   1;
    ~^/api/         1;
    ~^/crontab      1;
    ~^/install      1;
}

upstream likeadmin_go {
    server 127.0.0.1:8080;
    # server 127.0.0.1:8081;
}

server {
    listen 127.0.0.1:8091;
    server_name pair1.likeadmin.test pair2.likeadmin.test localhost 127.0.0.1;
    root /workspace/public;
    index index.html;
    client_max_body_size 50m;

    # $http_host keeps the listen port (8091). $host strips it, so Go
    # ctxutil.Domain() would emit http://127.0.0.1/platformapi/... and
    # clients (pair.sh export/zip download) hit :80.
    location ~ ^/index.php/(platformapi|tenantapi|api|crontab|install) {
        rewrite ^/index.php(.*)$ $1 break;
        proxy_pass http://likeadmin_go;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header token $http_token;
    }

    location ~ ^/(platformapi|tenantapi|api)/upload/ {
        client_max_body_size 50m;
        proxy_read_timeout 120s;
        proxy_pass http://likeadmin_go;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header token $http_token;
    }
    location /platformapi/ {
        client_max_body_size 1m;
        proxy_pass http://likeadmin_go;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header token $http_token;
    }
    location /tenantapi/ {
        client_max_body_size 1m;
        proxy_pass http://likeadmin_go;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header token $http_token;
    }
    location /api/ {
        client_max_body_size 1m;
        proxy_pass http://likeadmin_go;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header token $http_token;
    }
    location /crontab {
        proxy_pass http://likeadmin_go;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /install {
        proxy_pass http://likeadmin_go;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* ^/(platform|admin|mobile|pc)/assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
        access_log off;
    }
    location /platform {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /platform/index.html;
    }
    location /admin {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /admin/index.html;
    }
    location /mobile {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /mobile/index.html;
    }
    location /pc {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /pc/index.html;
    }
    location /pages {
        proxy_pass http://likeadmin_go;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /packages {
        proxy_pass http://likeadmin_go;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        try_files $uri =404;
        client_max_body_size 50m;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
    location /resource/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
